<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11100e">
<title>Roll 12</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#e5d5b1;font-family:Georgia,serif}
button,input,select{font:inherit}
button{touch-action:manipulation}
.screen{display:none;position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.screen.active{display:flex}

/* CAMERA: a simple, full-screen camera back */
#cameraScreen{background:#24231f;align-items:center;justify-content:center}
.camera-back{position:relative;width:100%;height:100%;padding:clamp(12px,3vw,34px);
display:grid;grid-template-rows:auto 1fr auto;gap:clamp(10px,2vw,24px);
background:linear-gradient(135deg,#6e6a61,#373630 38%,#1d1c19 100%)}
.camera-back:after{content:"";position:absolute;inset:10px;border:2px solid #aaa59a55;pointer-events:none}
.camera-top,.camera-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:1}
.camera-name{font-size:clamp(16px,3vw,32px);letter-spacing:clamp(2px,1vw,7px);font-weight:bold}
.counter{font-family:monospace;font-size:clamp(18px,4vw,36px);background:#10100f;color:#d6b873;
padding:7px 14px;border:3px inset #625b4d;min-width:90px;text-align:center}
.camera-main{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:clamp(12px,4vw,60px);z-index:1;min-height:0}
.left-controls,.right-controls{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vw,22px)}
.viewfinder{width:min(42vw,390px);height:min(42vw,390px);max-width:42vh;max-height:42vh;min-width:130px;min-height:130px;
border-radius:50%;border:clamp(8px,1.5vw,15px) solid #77736a;
background:#111;box-shadow:inset 0 0 0 5px #2c3938,0 12px 25px #000b;position:relative;overflow:hidden;justify-self:center}
#video{display:none;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#b7a77e;font-size:clamp(13px,2vw,22px);letter-spacing:1px}
.camera-button{border:3px solid #282621;border-radius:10px;background:linear-gradient(#d9d2c4,#928b7e);color:#24221d;
padding:clamp(10px,1.5vw,17px) clamp(12px,2vw,25px);box-shadow:0 5px 0 #111;font-weight:bold;font-size:clamp(12px,1.7vw,22px)}
.camera-button:active{transform:translateY(3px);box-shadow:0 2px 0 #111}
.camera-button:disabled{opacity:.35}
.shutter{width:min(25vw,220px);height:min(25vw,220px);min-width:105px;min-height:105px;border-radius:50%;
border:clamp(8px,1.5vw,13px) solid #4a4740;background:radial-gradient(circle at 35% 25%,#eee8d9,#aaa394 60%,#686257);
box-shadow:0 10px 18px #000b,inset 0 0 0 3px #d2cbbb;color:#24221d;font-size:clamp(14px,2vw,24px);font-weight:bold}
.small{font-size:clamp(11px,1.5vw,17px);text-align:center;color:#d0c3a5;line-height:1.3}
.dial-row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.dial-row button{padding:8px 11px}
.active{outline:3px solid #c49b58;background:#c49b58!important}
#message{max-width:360px}

/* DARKROOM: three large, usable baths */
#darkroomScreen{background:#180b0d;flex-direction:column}
.darkroom-stage{height:100%;display:flex;flex-direction:column}
.darkroom-content{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px}
.bath{min-width:0;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#3a171b,#1b0d0f);
border:5px solid #5d292d;border-radius:12px;padding:10px;gap:10px}
.bath h2{margin:0;text-align:center;font-size:clamp(14px,2.2vw,28px);letter-spacing:1px}
.bath .tray{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#260f12;
border:5px solid #6d3035;border-radius:7px;overflow:hidden}
.bath img{max-width:94%;max-height:94%;object-fit:contain;border:7px solid #e9ddc1;background:#eee5d0}
.bath .status{text-align:center;min-height:2.5em;font-size:clamp(11px,1.4vw,16px);color:#d9aaa7}
.bath button{width:100%;padding:clamp(10px,1.5vw,18px) 5px;background:#a34b3d;color:#ffe9d7;border:2px solid #5d2524;border-radius:7px;font-weight:bold;font-size:clamp(11px,1.5vw,18px)}
.darkroom-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:#241012}
.darkroom-bottom button{padding:9px 13px}

/* DRYING LINE */
#hangingScreen{background:#171512;flex-direction:column}
.hanging-area{flex:1;overflow:auto;padding:70px 25px 25px;background:repeating-linear-gradient(0deg,#201d18 0,#201d18 3px,#181613 3px,#181613 38px);position:relative}
.hanging-area:before{content:"";position:absolute;top:42px;left:0;right:0;height:5px;background:#a18b65;box-shadow:0 3px 0 #000}
.hanging-row{display:flex;gap:28px;min-width:max-content}
.hanging-photo{width:clamp(145px,20vw,270px);height:clamp(190px,28vw,350px);position:relative;padding-top:22px}
.hanging-photo:before{content:"";position:absolute;top:0;left:50%;height:32px;width:3px;background:#c4ad83}
.clip{position:absolute;top:25px;left:calc(50% - 12px);width:24px;height:34px;border:3px solid #c4ad83;background:#4b4030;border-radius:4px;z-index:2}
.hanging-photo img{width:100%;height:100%;object-fit:contain;background:#eee5d0;border:9px solid #eee5d0;box-shadow:0 8px 15px #0009}
.hanging-photo button{display:block;margin:8px auto;padding:6px 10px;background:#c2a77a;border:2px solid #655136;color:#211b13;border-radius:4px}
.line-bottom{padding:10px 14px;background:#29251e;display:flex;justify-content:space-between;align-items:center}

/* Portrait phones: stack the camera controls instead of clipping them */
@media (orientation:portrait) and (max-width:700px){
 .camera-back{padding:12px;gap:8px}
 .camera-top{align-items:center}
 .camera-name{font-size:17px}
 .camera-main{grid-template-columns:1fr;grid-template-rows:auto auto auto;gap:10px;overflow:auto}
 .viewfinder{width:31vh;height:31vh;min-width:120px;min-height:120px}
 .left-controls,.right-controls{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:7px}
 .left-controls .small,.right-controls .small{display:none}
 .camera-bottom{flex-wrap:wrap;justify-content:center}
 .shutter{width:23vh;height:23vh;min-width:105px;min-height:105px}
}
@media (max-width:800px){
 .darkroom-content{gap:5px;padding:5px}
 .bath{padding:5px;border-width:2px;gap:5px}
 .bath h2{font-size:12px}
 .bath img{border-width:4px}
}
@media (orientation:portrait) and (max-width:700px){
 .darkroom-content{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));overflow:auto}
 .bath{min-height:190px}
}
.modal{display:none;position:absolute;inset:0;background:#000d;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.show{display:flex}.modal img{max-width:92%;max-height:85%;border:10px solid #eee5d0}.modal button{position:absolute;top:15px;right:15px;padding:9px 14px}
</style>
</head>
<body>
<section id="cameraScreen" class="screen active">
<div class="camera-back">
 <div class="camera-top"><div class="camera-name">ROLL 12</div><div class="counter" id="counter">01 / 12</div></div>
 <div class="camera-main">
  <div class="left-controls">
   <button class="camera-button" id="cameraBtn">ENABLE CAMERA</button>
   <div class="dial-row"><button class="camera-button active" data-exp="normal">N</button><button class="camera-button" data-exp="bright">+</button><button class="camera-button" data-exp="dark">−</button><button class="camera-button" data-exp="mono">B&W</button></div>
   <button class="camera-button" id="flashBtn">FLASH OFF</button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0">
   <div class="viewfinder"><video id="video" autoplay playsinline></video><div id="placeholder">VIEWFINDER<br>READY</div></div>
   <div class="small" id="message">Press the shutter, then advance the film.</div>
   <button class="shutter" id="shutter">SHUTTER</button>
  </div>
  <div class="right-controls">
   <button class="camera-button" id="advance">↻ ADVANCE FILM</button>
   <button class="camera-button" id="develop" disabled>DEVELOP ROLL</button>
   <button class="camera-button" id="reset">RESET</button>
  </div>
 </div>
 <div class="camera-bottom"><div class="small">35mm • ISO 400</div><div class="small">12 exposures</div><div class="small">Mechanical camera</div></div>
</div>
</section>

<section id="darkroomScreen" class="screen">
<div class="darkroom-stage">
 <div class="darkroom-content" id="baths"></div>
 <div class="darkroom-bottom"><span id="darkCount">0 / 12 fixed</span><button class="camera-button" id="drying">DRYING LINE</button></div>
</div>
</section>

<section id="hangingScreen" class="screen">
<div class="hanging-area"><div class="hanging-row" id="hangingRow"></div></div>
<div class="line-bottom"><span id="hangCount">12 / 12 hanging</span><button class="camera-button" id="backDark">DARKROOM</button></div>
</section>

<div class="modal" id="modal"><button class="camera-button" id="close">CLOSE</button><img id="large" alt="Photograph"></div>

<script>
const $=id=>document.getElementById(id);
let frames=[],index=0,ready=true,exp="normal",flash=false,stream=null,stage=0,bathFrame=0;
let ctx=null;
function tone(kind){try{ctx ||= new (AudioContext||webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.connect(g);g.connect(ctx.destination);o.type=kind==="roll"?"sawtooth":"square";o.frequency.setValueAtTime(kind==="roll"?90:130,t);o.frequency.exponentialRampToValueAtTime(kind==="roll"?180:55,t+.22);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start();o.stop(t+.26)}catch(e){}}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function update(){ $("counter").textContent=String(Math.min(index+1,12)).padStart(2,"0")+" / 12";$("shutter").disabled=!ready||index>=12;$("advance").disabled=ready||index>=12;$("develop").disabled=frames.length!==12;$("message").textContent=index>=12?"Roll complete. Develop your film.":ready?"Press the shutter, then advance the film.":"Advance the film before the next photograph."}
function makeImage(){
 const c=document.createElement("canvas");c.width=900;c.height=650;let x=c.getContext("2d");
 if($("video").style.display==="block"&&$("video").videoWidth){c.width=$("video").videoWidth;c.height=$("video").videoHeight;x.drawImage($("video"),0,0,c.width,c.height)}
 else{x.fillStyle="#d8c9aa";x.fillRect(0,0,c.width,c.height);x.fillStyle="#443c30";x.textAlign="center";x.font="bold 48px Georgia";x.fillText("TEST FRAME",c.width/2,c.height/2)}
 let im=x.getImageData(0,0,c.width,c.height),d=im.data;
 for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];if(exp==="bright"){r*=1.18;g*=1.18;b*=1.18}if(exp==="dark"){r*=.7;g*=.7;b*=.7}if(exp==="mono"){let y=.299*r+.587*g+.114*b;r=g=b=y}let n=(Math.random()-.5)*16;r+=n;g+=n;b+=n;d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b))}
 x.putImageData(im,0,0);return c.toDataURL("image/jpeg",.9)
}
$("cameraBtn").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});$("video").srcObject=stream;$("video").style.display="block";$("placeholder").style.display="none";$("cameraBtn").textContent="CAMERA ON"}catch(e){$("message").textContent="Camera permission was not available; test frames can still be taken."}};
$("shutter").onclick=()=>{if(!ready||index>=12)return;frames.push({url:makeImage(),fixed:false});index++;ready=false;tone("shutter");update()};
$("advance").onclick=()=>{if(index<12){ready=true;tone("roll");update()}};
$("flashBtn").onclick=()=>{flash=!flash;$("flashBtn").textContent="FLASH "+(flash?"ON":"OFF")};
document.querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>{exp=b.dataset.exp;document.querySelectorAll("[data-exp]").forEach(x=>x.classList.toggle("active",x===b))});
$("reset").onclick=()=>{if(confirm("Discard this roll?")){frames=[];index=0;ready=true;update()}};
$("develop").onclick=()=>{buildBaths();show("darkroomScreen")};
function buildBaths(){stage=0;bathFrame=0;$("baths").innerHTML="";[["DEVELOPER","Reveal the image"],["STOP BATH","Stop the reaction"],["FIXER","Make it permanent"]].forEach((a,i)=>{let b=document.createElement("div");b.className="bath";b.innerHTML=`<h2>${a[0]}</h2><div class="tray" id="tray${i}"><span class="status">No print in this bath</span></div><div class="status" id="status${i}">${a[1]}</div><button id="bath${i}" ${i?"disabled":""}>${i?"WAITING":"DROP PRINT 1"}</button>`;$("baths").appendChild(b);$("bath"+i).onclick=()=>drop(i)});updateDark()}
function drop(i){if(i!==stage||!frames[bathFrame])return;let f=frames[bathFrame],tray=$("tray"+i);tray.innerHTML="";let im=document.createElement("img");im.src=f.url;im.style.filter=i===0?"brightness(0)":"";tray.appendChild(im);$("bath"+i).disabled=true;let n=0,t=setInterval(()=>{n++;if(i===0){im.style.filter="brightness("+(n/5)+")";$("status0").textContent="Image emerging…"}else{$("status"+i).textContent=i===1?"Stopping…":"Fixing…"}if(n>=(i===0?5:i===1?3:4)){clearInterval(t);if(i===2){f.fixed=true;bathFrame++;stage=0;$("status2").textContent="Fixed — ready to hang";if(bathFrame<12){$("bath0").disabled=false;$("bath0").textContent="DROP PRINT "+(bathFrame+1)}else{$("bath0").textContent="ALL PRINTS FIXED";$("drying").disabled=false}}else{stage=i+1;$("bath"+(i+1)).disabled=false;$("status"+(i+1)).textContent="Ready for print "+(bathFrame+1)}updateDark()}},550)}
function updateDark(){$("darkCount").textContent=frames.filter(f=>f.fixed).length+" / 12 fixed";$("drying").disabled=!frames.every(f=>f.fixed)}
$("drying").onclick=()=>{ $("hangingRow").innerHTML="";frames.forEach((f,i)=>{let w=document.createElement("div");w.className="hanging-photo";w.innerHTML=`<div class="clip"></div><img src="${f.url}" alt="Frame ${i+1}"><button>VIEW ${i+1}</button>`;w.querySelector("button").onclick=()=>{$("large").src=f.url;$("modal").classList.add("show")};$("hangingRow").appendChild(w)});show("hangingScreen")};
$("backDark").onclick=()=>show("darkroomScreen");$("close").onclick=()=>$("modal").classList.remove("show");
update();
</script>
</body>
</html>
