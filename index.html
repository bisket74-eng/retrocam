<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Camera & Darkroom</title>
  <style>
    /* BASE STYLES */
    body, html { 
      margin: 0; padding: 0; height: 100%; 
      background: #000; font-family: sans-serif; 
      color: #fff; overflow: hidden; 
      touch-action: none; 
    }
    
    /* 1. CAMERA VIEW UI (The "Camera Back") */
    #camera-view { 
      display: flex; flex-direction: column; justify-content: space-between;
      height: 100%; padding: 20px; box-sizing: border-box; 
      /* Simulated vintage camera leatherette texture */
      background-color: #1c1c1c;
      background-image: radial-gradient(#2b2b2b 15%, transparent 16%), radial-gradient(#2b2b2b 15%, transparent 16%);
      background-size: 4px 4px;
      background-position: 0 0, 2px 2px;
      border: 8px solid #333; /* The metal camera body edge */
      border-radius: 12px;
    }
    
    /* The tiny square viewfinder */
    .viewfinder-container {
      width: 120px; 
      height: 120px; 
      margin: 10px auto 30px auto; /* Centers it near the top */
      border: 6px solid #111; 
      border-radius: 4px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 2px 0 rgba(255,255,255,0.1);
      overflow: hidden;
      background: #000;
      position: relative;
    }
    #viewfinder { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }

    .controls { 
      display: flex; flex-direction: column; gap: 20px; 
      background: #222; padding: 15px; border-radius: 8px;
      border: 2px solid #111; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      margin-bottom: auto;
    }
    .control-group { 
      display: flex; justify-content: space-between; align-items: center; 
    }
    input[type="range"] { 
      flex: 1; margin-left: 15px; 
    }
    
    .actions { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
      margin-top: 20px;
    }
    button { 
      padding: 15px; font-size: 15px; border: none; 
      border-radius: 8px; cursor: pointer; font-weight: bold; 
      box-shadow: 0 4px 0 #111;
      transition: all 0.1s;
    }
    button:active:not(:disabled) {
      transform: translateY(4px); box-shadow: 0 0 0 #111;
    }
    button:disabled {
      opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #000;
    }

    #shutter-btn { background: #ff4444; color: white; }
    #wind-btn { background: #b0b0b0; color: #111; }
    #darkroom-btn { grid-column: span 2; background: #444; color: white; margin-top: 10px; }

    /* 2. DARKROOM VIEW UI */
    #darkroom-view { 
      display: none; 
      grid-template-columns: repeat(3, 1fr); gap: 20px; 
      padding: 20px; height: 100%; 
      background-color: #1a1a1a; position: relative; 
      box-sizing: border-box; 
    }
    .tray { 
      background-color: #2a2a2a; border-radius: 12px; 
      box-shadow: inset 0 10px 20px rgba(0,0,0,0.8), 0 0 0 8px #d3d3d3; 
      display: flex; align-items: center; justify-content: center; 
      color: #555; font-weight: bold; font-size: 1.5rem;
      position: relative;
    }
    .tray-label {
      position: absolute; pointer-events: none;
    }
    
    #developed-photo {
      width: 80%; height: 80%; 
      object-fit: cover; 
      border: 6px solid #e0e0e0; 
      border-radius: 2px;
      filter: grayscale(100%) contrast(1.3) sepia(20%); 
      opacity: 0; 
      transition: opacity 8s ease-in-out; 
      z-index: 5;
      display: none; 
      cursor: grab;
      touch-action: none; 
      position: absolute; 
    }
    #developed-photo:active { cursor: grabbing; }
    #developed-photo.developing { opacity: 1; }

    .safelight-overlay { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background-color: red; mix-blend-mode: multiply; 
      pointer-events: none; opacity: 0.85; z-index: 10; 
    }
    #exit-darkroom-btn { 
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
      padding: 10px 20px; background: #fff; color: #000; z-index: 20; 
    }
  </style>
</head>
<body>

  <!-- CAMERA HTML -->
  <div id="camera-view">
    <div class="viewfinder-container">
      <video id="viewfinder" autoplay playsinline></video>
    </div>
    
    <canvas id="capture-canvas" style="display: none;"></canvas>
    
    <div class="controls">
      <div class="control-group">
        <label>ISO</label>
        <input type="range" class="manual-dial" min="100" max="3200" step="100" value="400">
      </div>
      <div class="control-group">
        <label>Focus</label>
        <input type="range" class="manual-dial" min="0" max="100" value="50">
      </div>
    </div>

    <div class="actions">
      <button id="shutter-btn">SNAP PHOTO</button>
      <button id="wind-btn" disabled>WIND FILM</button>
      <button id="darkroom-btn">ENTER DARKROOM</button>
    </div>
  </div>

  <!-- DARKROOM HTML -->
  <div id="darkroom-view">
    <div class="tray developer" id="tray-dev">
      <div class="tray-label">Developer</div>
      <img id="developed-photo" src="" alt="Developing print" draggable="false">
    </div>
    <div class="tray stop-bath" id="tray-stop"><div class="tray-label">Stop Bath</div></div>
    <div class="tray fixer" id="tray-fix"><div class="tray-label">Fixer</div></div>
    
    <div class="safelight-overlay"></div>
    <button id="exit-darkroom-btn">Leave Darkroom</button>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Audio Setup
    const shutterSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2299/2299-preview.mp3'); 
    const filmWindSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2626/2626-preview.mp3'); 
    const dialClickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3'); 
    dialClickSound.volume = 0.4;

    // DOM Elements
    const cameraView = document.getElementById('camera-view');
    const darkroomView = document.getElementById('darkroom-view');
    const shutterBtn = document.getElementById('shutter-btn');
    const windBtn = document.getElementById('wind-btn');
    const darkroomBtn = document.getElementById('darkroom-btn');
    const exitDarkroomBtn = document.getElementById('exit-darkroom-btn');
    const dials = document.querySelectorAll('.manual-dial');
    const viewfinder = document.getElementById('viewfinder');
    
    const captureCanvas = document.getElementById('capture-canvas');
    const ctx = captureCanvas.getContext('2d');
    const developedPhoto = document.getElementById('developed-photo');
    const devTray = document.getElementById('tray-dev');
    
    let photoCaptured = false;
    let isFilmWound = true; // Tracks if the camera is ready to fire

    // Camera Feed
    async function startCamera() {
      try {
        // We ensure we grab the rear camera
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        viewfinder.srcObject = stream;
      } catch (err) {
        console.error("Camera access denied:", err);
      }
    }
    startCamera();

    // 1. Shutter: Capture Photo
    shutterBtn.addEventListener('click', () => {
      if (!isFilmWound) return; // Failsafe

      shutterSound.currentTime = 0;
      shutterSound.play().catch(e => {});
      if (navigator.vibrate) navigator.vibrate(100);

      // Capture Image
      captureCanvas.width = viewfinder.videoWidth;
      captureCanvas.height = viewfinder.videoHeight;
      ctx.drawImage(viewfinder, 0, 0, captureCanvas.width, captureCanvas.height);
      
      developedPhoto.src = captureCanvas.toDataURL('image/jpeg');
      developedPhoto.style.display = 'block';
      
      devTray.appendChild(developedPhoto);
      xOffset = 0; yOffset = 0; 
      setTranslate(0, 0, developedPhoto);

      developedPhoto.classList.remove('developing');
      photoCaptured = true;

      // Lock shutter, require winding
      isFilmWound = false;
      shutterBtn.disabled = true;
      windBtn.disabled = false;
    });

    // 2. Winder: Advance Film
    windBtn.addEventListener('click', () => {
      if (isFilmWound) return; // Failsafe

      filmWindSound.currentTime = 0;
      filmWindSound.play().catch(e => {});
      if (navigator.vibrate) navigator.vibrate([30, 40, 30, 40]);

      // Re-arm shutter
      isFilmWound = true;
      windBtn.disabled = true;
      shutterBtn.disabled = false;
    });

    // Dials
    dials.forEach(dial => {
      dial.addEventListener('input', () => {
        dialClickSound.currentTime = 0;
        dialClickSound.play().catch(e => {});
        if (navigator.vibrate) navigator.vibrate(15);
      });
    });

    // Enter Darkroom
    darkroomBtn.addEventListener('click', () => {
      cameraView.style.display = 'none';
      darkroomView.style.display = 'grid';

      if (photoCaptured) {
        setTimeout(() => developedPhoto.classList.add('developing'), 500); 
      }

      document.documentElement.requestFullscreen().then(() => {
        return screen.orientation.lock('landscape');
      }).catch(err => console.log(err));
    });

    // Leave Darkroom
    exitDarkroomBtn.addEventListener('click', () => {
      darkroomView.style.display = 'none';
      cameraView.style.display = 'flex';
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(err => console.log(err));
      }
    });

    // Drag and Drop Logic
    let isDragging = false;
    let currentX, currentY, initialX, initialY;
    let xOffset = 0, yOffset = 0;

    developedPhoto.addEventListener("pointerdown", dragStart, false);
    document.addEventListener("pointerup", dragEnd, false);
    document.addEventListener("pointermove", drag, false);

    function dragStart(e) {
      initialX = e.clientX - xOffset;
      initialY = e.clientY - yOffset;
      if (e.target === developedPhoto) {
        isDragging = true;
        developedPhoto.style.zIndex = 100; 
      }
    }

    function drag(e) {
      if (isDragging) {
        e.preventDefault();
        currentX = e.clientX - initialX;
        currentY = e.clientY - initialY;
        xOffset = currentX;
        yOffset = currentY;
        setTranslate(currentX, currentY, developedPhoto);
      }
    }

    function setTranslate(xPos, yPos, el) {
      el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
    }

    function dragEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      developedPhoto.style.zIndex = 5;

      developedPhoto.style.visibility = 'hidden';
      const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
      developedPhoto.style.visibility = 'visible';

      if (dropTarget) {
        const tray = dropTarget.closest('.tray');
        if (tray) {
          if (navigator.vibrate) navigator.vibrate(20);
          tray.appendChild(developedPhoto);
          xOffset = 0; yOffset = 0;
          setTranslate(0, 0, developedPhoto);
        } else {
          xOffset = 0; yOffset = 0;
          setTranslate(0, 0, developedPhoto);
        }
      }
    }
  </script>
</body>
</html>
