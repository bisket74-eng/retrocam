<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Camera & Darkroom</title>
  <style>
    /* BASE STYLES */
    body, html { 
      margin: 0; padding: 0; height: 100%; 
      background: #111; font-family: sans-serif; 
      color: #fff; overflow: hidden; 
    }
    
    /* 1. CAMERA VIEW UI */
    #camera-view { 
      display: flex; flex-direction: column; 
      height: 100%; padding: 20px; box-sizing: border-box; 
    }
    .viewfinder { 
      flex: 1; background: #000; border: 4px solid #333; 
      border-radius: 8px; margin-bottom: 20px; 
      display: flex; align-items: center; justify-content: center; 
      color: #666; font-size: 1.2rem;
    }
    .controls { 
      display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; 
    }
    .control-group { 
      display: flex; justify-content: space-between; align-items: center; 
    }
    input[type="range"] { 
      flex: 1; margin-left: 15px; 
    }
    .actions { 
      display: flex; justify-content: space-between; gap: 10px; 
    }
    button { 
      padding: 15px; font-size: 16px; border: none; 
      border-radius: 8px; cursor: pointer; font-weight: bold; 
    }
    #shutter-btn { flex: 2; background: #ff4444; color: white; }
    #darkroom-btn { flex: 1; background: #444; color: white; }

    /* 2. DARKROOM VIEW UI */
    #darkroom-view { 
      display: none; 
      grid-template-columns: repeat(3, 1fr); gap: 20px; 
      padding: 20px; height: 100%; 
      background-color: #1a1a1a; position: relative; 
      box-sizing: border-box; 
    }
    .tray { 
      background-color: #2a2a2a; border-radius: 12px; 
      box-shadow: inset 0 10px 20px rgba(0,0,0,0.8), 0 0 0 8px #d3d3d3; 
      display: flex; align-items: center; justify-content: center; 
      color: #555; font-weight: bold; font-size: 1.5rem;
    }
    .safelight-overlay { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background-color: red; 
      mix-blend-mode: multiply; 
      pointer-events: none; opacity: 0.85; z-index: 10; 
    }
    #exit-darkroom-btn { 
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
      padding: 10px 20px; background: #fff; color: #000; z-index: 20; 
    }
  </style>
</head>
<body>

  <!-- CAMERA HTML -->
  <div id="camera-view">
    <div class="viewfinder">Live Camera Feed Goes Here</div>
    
    <div class="controls">
      <div class="control-group">
        <label>ISO</label>
        <input type="range" class="manual-dial" min="100" max="3200" step="100" value="400">
      </div>
      <div class="control-group">
        <label>Focus</label>
        <input type="range" class="manual-dial" min="0" max="100" value="50">
      </div>
    </div>

    <div class="actions">
      <button id="shutter-btn">SHUTTER</button>
      <button id="darkroom-btn">DARKROOM</button>
    </div>
  </div>

  <!-- DARKROOM HTML -->
  <div id="darkroom-view">
    <div class="tray developer">Developer</div>
    <div class="tray stop-bath">Stop Bath</div>
    <div class="tray fixer">Fixer</div>
    
    <div class="safelight-overlay"></div>
    <button id="exit-darkroom-btn">Leave Darkroom</button>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // 1. Audio Setup (Using direct URLs from Mixkit's free sound library)
    const shutterSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2299/2299-preview.mp3'); // Hard shutter snap
    const filmWindSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2626/2626-preview.mp3'); // Mechanical swipe/wind
    const dialClickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3'); // UI mechanical click
    
    dialClickSound.volume = 0.4;

    // 2. DOM Elements
    const cameraView = document.getElementById('camera-view');
    const darkroomView = document.getElementById('darkroom-view');
    const shutterBtn = document.getElementById('shutter-btn');
    const darkroomBtn = document.getElementById('darkroom-btn');
    const exitDarkroomBtn = document.getElementById('exit-darkroom-btn');
    const dials = document.querySelectorAll('.manual-dial');

    // 3. Shutter: Sound + Haptic Vibration
    shutterBtn.addEventListener('click', () => {
      shutterSound.currentTime = 0;
      shutterSound.play().catch(e => console.log('Audio blocked by browser:', e));
      
      if (navigator.vibrate) navigator.vibrate(100);

      setTimeout(() => {
        filmWindSound.currentTime = 0;
        filmWindSound.play().catch(e => {});
        
        if (navigator.vibrate) navigator.vibrate([30, 40, 30, 40]);
      }, 600);
    });

    // 4. Manual Dials: Sound + Haptic Vibration
    dials.forEach(dial => {
      dial.addEventListener('input', () => {
        dialClickSound.currentTime = 0;
        dialClickSound.play().catch(e => {});
        
        if (navigator.vibrate) navigator.vibrate(15);
      });
    });

    // 5. Enter Darkroom: Fullscreen & Landscape Lock
    darkroomBtn.addEventListener('click', () => {
      cameraView.style.display = 'none';
      darkroomView.style.display = 'grid';

      document.documentElement.requestFullscreen().then(() => {
        return screen.orientation.lock('landscape');
      }).catch(err => {
        console.log("Fullscreen/Orientation lock unavailable: ", err);
      });
    });

    // 6. Leave Darkroom: Revert to Camera
    exitDarkroomBtn.addEventListener('click', () => {
      darkroomView.style.display = 'none';
      cameraView.style.display = 'flex';
      
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(err => console.log(err));
      }
    });
  </script>
</body>
</html>
